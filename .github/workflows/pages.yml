name: Deploy HISTORIA PWA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historia-pages
  cancel-in-progress: false
jobs:
  site:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pil python3-yaml
      - run: |
          python3 scripts/prepare_site.py
          python3 scripts/validate.py
          node --check site/app.js
          node --check site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
