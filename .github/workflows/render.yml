name: Render HISTORIA (cloud)
on:
  workflow_dispatch:
    inputs:
      language:
        description: Language
        type: choice
        options: [both, fr, en]
        default: both
      smoke:
        description: Test only (8 seconds, not the full episode)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: historia-render
  cancel-in-progress: false
jobs:
  render:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install free system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core python3-pil python3-yaml python3-venv
          python3 -m venv --system-site-packages /tmp/historia-venv
          /tmp/historia-venv/bin/pip install piper-tts==1.8.0
      - name: Prepare and validate
        run: |
          python3 scripts/prepare_site.py
          python3 scripts/validate.py
          node --check site/app.js
          node --check site/sw.js
      - name: Render and decode-check
        env:
          LANGUAGE_CHOICE: ${{ inputs.language }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          args=()
          if [ "$SMOKE" = "true" ]; then args+=(--smoke); fi
          /tmp/historia-venv/bin/python scripts/render.py --lang "$LANGUAGE_CHOICE" "${args[@]}"
      - name: Keep deliverables briefly (shared free storage)
        uses: actions/upload-artifact@v4
        with:
          name: historia-${{ inputs.language }}-${{ github.run_id }}
          path: build/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
